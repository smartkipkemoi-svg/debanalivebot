name: De Bana Live

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: de-bana-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest
        run: git pull --rebase || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install requests

      - name: Init posted.json
        run: |
          if [ ! -f posted.json ]; then echo "[]" > posted.json; fi

      - name: Run bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: |
          timeout 340 python bot.py || true

      - name: Save posted.json
        run: |
          git config user.name "De Bana Bot"
          git config user.email "bot@debana.com"
          git add posted.json
          git diff --staged --quiet || git commit -m "save [skip ci]"
          git push || true
