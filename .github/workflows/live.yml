name: de-bana-football
language: python
version: "3.11"

install:
    - pip install --upgrade pip
    - pip install requests

# change main.py if your file name is different
run: python main.py

# keep it alive 24/7
daemon: true

# restart every 4.5 hours to stay fresh
restart:
  after: 270m
  on_failure: true
  delay: 30s

# IMPORTANT: only 1 bot at a time - stops double posts
concurrency: 1

# THIS FIXES YOUR DUPLICATE - keeps posted.json after restart
keep_files:
    - posted.json

# logs
logs:
  max_size: 10mb
  keep: 2

# bot.by will use 256MB - enough for 20 threads
memory: 256
