name: De Bana Live

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install requests

      - name: Init posted.json
        run: |
          if [ ! -f posted.json ]; then echo "[]" > posted.json; fi

      - name: Run bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: |
          timeout 270 python main.py || true

      - name: Save posted.json
        run: |
          git config user.name "De Bana Bot"
          git config user.email "bot@debana.com"
          git add posted.json || true
          git diff --staged --quiet || git commit -m "save posted [skip ci]"
          git push || true
