name: De Bana Live Bot
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:
jobs:
  post-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: python bot.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@debana.com"
          git add posted.json || true
          git commit -m "update scores" || true
          git push || true
